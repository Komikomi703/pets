[package]
name = "madoneko"
version = "1.2.0"
description = "まどねこ — デスクトップの小さな同居人"
authors = ["MadoNeko contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "madoneko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
panic = "abort"
